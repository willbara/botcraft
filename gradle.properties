org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric properties, pinned for Minecraft 1.20.1.
# Verified 2026-10-09 against meta.fabricmc.net / maven.fabricmc.net:
#   yarn 1.20.1+build.10 is the latest Yarn build for 1.20.1
#   fabric-api 0.92.12+1.20.1 is the latest Fabric API for 1.20.1 (same as the Test profile)
#   loader 0.19.5 is the latest loader (same as the Test profile)
#   loom 1.18.3 is the latest Loom release (requires Gradle 9.7+ running on Java 25)
minecraft_version=1.20.1
yarn_mappings=1.20.1+build.10
loader_version=0.19.5
loom_version=1.18.3
fabric_api_version=0.92.12+1.20.1

# Mod properties
mod_version=0.10.0
maven_group=com.botcraft
archives_base_name=botcraft

# ./gradlew deployToTest copies the jar into <mc_dir>/mods. Set mc_dir (the Minecraft instance
# folder) in ~/.gradle/gradle.properties, the MC_DIR environment variable, or -Pmc_dir=...
